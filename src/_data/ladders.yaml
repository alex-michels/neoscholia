# Лестницы статусов. На странице текста или статьи в шапке (front matter) пишется:
#   ladder: text      — какая лестница
#   status: models    — текущая ступень (key); все ступени до неё включительно отмечаются как пройденные.
# Чтобы переключить статус, достаточно поменять одно слово в status.

text:
  label: Статус проверки
  steps:
    - { key: draft,   label: Машинный черновик }
    - { key: models,  label: Перекрёстная проверка моделями }
    - { key: editor,  label: Проверено редактором }
    - { key: review,  label: Внешняя рецензия }
    - { key: final,   label: Окончательная версия }

study:
  label: Путь публикации
  steps:
    - { key: dossier,  label: Досье источников }
    - { key: preprint, label: Препринт }
    - { key: author,   label: Проверка автором }
    - { key: review,   label: Открытая рецензия }
    - { key: final,    label: Окончательная версия }
