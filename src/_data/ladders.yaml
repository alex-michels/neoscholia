# Лестницы статусов. На странице текста или статьи в шапке (front matter) пишется:
#   ladder: text      — какая лестница
#   status: models    — текущая ступень (key); все ступени до неё включительно отмечаются как пройденные.
# Чтобы переключить статус, достаточно поменять одно слово в status.
#
# Поля ступени: label — название; desc — что сделано на этой ступени; rely — на что читатель может опираться.
# Эти же тексты показаны под заголовком каждого текста (блок статуса) и на странице «Метод» (раздел «Статусы текста»).
# more — ссылка «подробнее» из блока статуса.

text:
  label: Статус проверки
  more: { href: "method.html#statuses", label: "Что значат статусы" }
  steps:
    - key: draft
      label: Машинный черновик
      desc: Есть переводы моделей, рецензия ещё не прошла.
      rely: Для чтения и ориентира, не для цитирования.
    - key: models
      label: Перекрёстная проверка моделями
      short: Проверено моделями
      desc: Прошла перекрёстная рецензия и арбитраж, журнал открыт.
      rely: Можно читать; спорные места видны в журнале.
    - key: editor
      label: Проверено редактором
      desc: Редактор проверил отмеченные места и выборку, подписал версию.
      rely: Можно цитировать с указанием версии и DOI.
    - key: review
      label: Внешняя рецензия
      desc: Текст прочитал названный специалист вне редакции; его отзыв и ответ редакции опубликованы.
      rely: Правки по отзыву войдут в окончательную версию.
    - key: final
      label: Окончательная версия
      desc: Замечания рецензии учтены, редакция утвердила версию. Дальше — только исправления, каждое с новым номером версии.
      rely: Научная публикация в полном смысле.

study:
  label: Путь публикации
  steps:
    - { key: dossier,  label: Досье источников }
    - { key: preprint, label: Препринт }
    - { key: author,   label: Проверка автором }
    - { key: review,   label: Открытая рецензия }
    - { key: final,    label: Окончательная версия }
