    text: '<span class="big">6</span> версий: редакции ε, λ, ζ, эпитома Цахера, византийская поэма 1388 г., «Римада» 1529 г.'
  - label: Первый пилот
    text: <a href="zacher-1.html">Эпитома Юлия Валерия, кн. I</a> — латынь, текст Zacher 1867; версия {version:zacher-1}
  - label: Основа текстов
    text: 'издания в общественном достоянии: Kroll 1926, Kübler 1888, Zacher 1867, Wagner 1881'
factsAside: true
blocks:
