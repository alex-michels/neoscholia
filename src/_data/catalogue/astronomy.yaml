  items:
    - href: zacher-1.html#c12
      title: Эпитома Юлия Валерия, I.12
      text: Нектанеб следит за «бегом звёзд» и велит Олимпиаде задержать роды до благоприятного часа. В I.14 Александр спрашивает о звёздах — и сталкивает учителя в ров.
    - href: odyssey-10.html#s2
      title: Схолии к «Одиссее» X, Σ 10.2
      text: 'Эол — «весьма сведущий в астрономии» знаток погоды: под Тельцом дует западный ветер, при заходе и восходе Пса — другие.'
    - href: study-laestrygonians.html
      title: Исследование «Пергам против Александрии?»
      text: Кратет помещает лестригонов под голову Дракона; Арат, Гиппарх, Гемин и расчёт длины дня.
