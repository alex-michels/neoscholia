h1: Астрономия и астрология
intro:
  - 'Для античного читателя это одна наука о небе. Слова <span lang="grc">ἀστρονομία</span> и <span lang="grc">ἀστρολογία</span> долго значили одно и то же, а латинское <i lang="la">mathematicus</i> в римское время обычно значит «астролог»: в эпитоме Юлия Валерия Олимпиада спрашивает Нектанеба, тот ли он знаток «математики» (<a href="zacher-1.html#c4">I.4</a>).'
  - 'Птолемей делит предсказание по звёздам на две части: первая изучает движения светил — это «Альмагест», вторая — их действие на земное, это «Четверокнижие» (1.1). Скептик Секст Эмпирик спорит только с генетлиалогией «халдеев» и оговаривает, что не трогает наблюдательную науку Евдокса и Гиппарха, «которую некоторые называют и астрономией» («Против учёных» V, 1–2). Раздельно две науки определяет уже Исидор: астрология у него «отчасти естественная, отчасти суеверная» («Этимологии» 3.27).'
  - 'Раздел объединяет обе: комментарии к Арату, введения в сферику, календари и приметы погоды, руководства по гороскопам и «выбору часа». Ядро греческой сферики уже есть по-русски благодаря А. И. Щетникову и журналу ΣΧΟΛΗ; мы начинаем с того, чего нет.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты — историки астрономии — приглашаются'
