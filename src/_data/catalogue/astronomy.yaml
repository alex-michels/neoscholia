catalogue:
  title: Тексты раздела
  note: Порядок — от первых публикаций к долгим проектам. Астрономию проверяет расчёт, как в <a href="study-laestrygonians.html">исследовании о Кратете</a>.
  id: cat-h
  filterLabel: Фильтр текстов
  all: Все
  groups:
    - key: astro
      label: Астрономия
    - key: astrol
      label: Астрология
    - key: cal
      label: Календари
    - key: ccag
      label: Из CCAG
    - key: ru
      label: Только для русского
  flag: только не переведённые ни на один язык
  empty: По этому фильтру текстов нет.
  items:
    - group: astro
      flag: true
      plan: флагман
      title: Гиппарх, «Комментарий к „Явлениям“ Арата и Евдокса»
      orig: Τῶν Ἀράτου καὶ Εὐδόξου φαινομένων ἐξήγησις
      origLang: grc
      info: II в. до н. э. · греческий · 3 книги
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Glover, CUP 2026)'
        - 'DE: Manitius 1894'
      rows:
        - - Основа
          - Manitius 1894 (ОД)
        - - Первая часть
          - кн. I, гл. 1–3, затем вся кн. I
        - - Зачем
          - единственное сохранившееся сочинение Гиппарха и главный источник сведений об Евдоксе и Аттале; продолжает наше исследование о голове Дракона
    - group: astrol
      flag: true
      plan: кандидат в первый пилот
      title: «Максим», «О начинаниях»
      orig: Περὶ καταρχῶν
      origLang: grc
      info: поздняя античность · греческие гексаметры · 610 стихов
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: не найден'
          kind: gap
        - 'FR: Zito 2016'
      rows:
        - - Основа
          - Ludwich 1877 (ОД); сверка с французским переводом
        - - Зачем
          - 'единственное стихотворное руководство по «выбору часа»: когда, по положению Луны, начинать дело — брак, покупку раба, лечение'
    - group: astro
      plan: кандидат · сверить статус
      planMuted: true
      title: Схолии к Арату
      orig: Scholia in Aratum vetera
      origLang: la
      info: эллинистические и римские слои · греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: заявлен проектом Aratus Project — уточняется'
      rows:
        - - Основа
          - Maass 1898 (ОД, неполно); Martin 1974 — под правами
        - - Первая часть
          - 'схолии к ст. 61–62: голова Дракона и Кратет'
    - group: astro
      plan: кандидат
      title: Феон Александрийский, комментарий к «Альмагесту», кн. III
      orig: Ὑπόμνημα εἰς τὴν Πτολεμαίου μεγάλην σύνταξιν
      origLang: grc
      info: IV в. · греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: отрывки'
      rows:
        - - Основа
          - Halma 1821–1822 (ОД)
        - - Зачем
          - заглавие книги III говорит, что её текст проверила дочь Феона — Гипатия
    - group: astro
      plan: кандидат
      title: Авиен, «Явления Арата»
      orig: Aratea
      origLang: la
      info: IV в. · латинские гексаметры
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: нет (в сети — непроверенный ИИ-перевод)'
          kind: gap
      rows:
        - - Основа
          - Breysig 1882 (ОД)
        - - Первая часть
          - проэмий и ст. 1–300
    - group: cal
      plan: кандидат
      title: 'Хронограф 354 года: календарь'
      orig: Chronographus anni CCCLIIII
      origLang: la
      info: Рим, 354 г. · латынь · иллюстрированный альманах
      tr:
        - text: 'RU: отрывки'
          kind: gap
        - 'EN: частично'
      rows:
        - - Основа
          - Mommsen 1892 (ОД)
        - - Зачем
          - римский календарь праздников с планетной неделей; в той же книге — списки римских епископов и мучеников
    - group: ru
      plan: кандидат
      title: Птолемей, «Фазы неподвижных звёзд»
      orig: Φάσεις ἀπλανῶν ἀστέρων
      origLang: grc
      info: II в. · греческий · календарь погоды
      tr:
        - text: 'RU: не найден'
