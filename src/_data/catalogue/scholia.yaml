h1: Схолии
intro:
  - 'Схолии — заметки на полях рукописей: объяснения слов, споры о чтениях, мифы, география, мораль. В них сохранилась работа александрийских филологов — Аристарха, Дидима, Геродиана — и множество цитат из утраченных книг.'
  - 'Почти ни один корпус схолий не переведён на русский, большинство — ни на один современный язык. Наш проект назван по ним: «новые схолии» — это и переводы старых, и наш комментарий на полях.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты-эллинисты и латинисты приглашаются'
facts:
  - label: Первая публикация
    text: '<a href="odyssey-10.html">Схолии к «Одиссее», песнь X, ст. 1–4</a> — версия {version:odyssey-10}: текст сверен по сканам, перевод сведён из двух независимых'
  - label: Основа текстов
    text: 'издания XIX — начала XX в. в общественном достоянии: Dindorf, Drachmann, Wendel, Stallbaum, Wessner; открытые TEI, где они есть'
figure: sections/scholia-figure.njk
blocks:
  - include: sections/scholia-lay.njk
    title: Слои схолий
    note: Схолии — не один автор, а сплав комментариев разных эпох. В переводе каждый слой помечен, чтобы было видно, чей голос звучит.
    id: lay-h
  - include: sections/scholia-ody.njk
    title: Серия «Схолии к „Одиссее“»
    note: 'Схолии к «Одиссее» не переведены ни на один современный язык. Комментарий Евстафия к песням 13–24 тоже: английский перевод Brill дошёл до песни 12.'
    id: ody-h
  - include: sections/scholia-cat.njk
    title: Корпуса схолий и комментариев
    note: Для каждого корпуса указана первая единица перевода. Порядок — по значимости и готовности текста.
    id: cat-h
  - closing
