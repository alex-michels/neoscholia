h1: Магия и мантика
intro:
  - 'Гадание (<span lang="grc">μαντική</span>, <i lang="la">divinatio</i>) было в античности признанным знанием: государства спрашивали оракулы, полководцы — гаруспиков, частные люди — толкователей снов и жребии. Магия считалась делом подозрительным и подсудным, но в текстах граница тонка: Нектанеб в «Романе об Александре» — и звездочёт, и маг.'
  - 'Раздел собирает то, что осталось от этого знания: вопросы к оракулам, книги жребиев и знамений, гадание по телу, привороты и любовную магию, магические папирусы, «Кираниды» и алхимиков. Сонники, герметические трактаты и Ямвлих о мистериях уже есть по-русски; мы начинаем с непереведённого.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты — специалисты по религии и магии — приглашаются'
