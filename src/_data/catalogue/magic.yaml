  filterLabel: Фильтр текстов
  all: Все
  groups:
    - key: div
      label: Гадание
    - key: love
      label: Привороты и любовная магия
    - key: magic
      label: Магия и алхимия
    - key: ccag
      label: Из CCAG
    - key: ru
      label: Только для русского
  flag: только не переведённые ни на один язык
  empty: По этому фильтру текстов нет.
  items:
    - group: div
      flag: true
      plan: кандидат в первый пилот · сверить статус
      planMuted: true
      title: Псевдо-Мелампод, «О трепетаниях» и «О родимых пятнах»
      orig: Περὶ παλμῶν μαντική · Περὶ ἐλαιῶν τοῦ σώματος
      origLang: grc
      info: поздняя античность · греческий · короткие трактаты
      tr:
        - text: 'RU: не найден'
          kind: gap
        - text: 'EN: не найден'
          kind: gap
      rows:
        - - Основа
          - Diels 1908; Franz 1780 (ОД)
        - - Зачем
          - 'бытовое гадание: что предвещает дрожь века или плеча и родинка на щеке; у традиции есть славянское продолжение — «Трепетник»'
    - group: love
      flag: true
      plan: кандидат
      title: Привораживающие заговоры в магических папирусах
      orig: PGM IV.296–466 и луврская фигурка
      info: III–IV вв. · греческий папирус
      tr:
        - text: 'RU: не найден'
          kind: gap
        - 'EN: полный (под ред. Betz)'
      rows:
        - - Основа
          - Wessely 1888 (ОД); издание Прейзенданца — под правами
        - - Зачем
          - настоящий любовный ритуал с восковыми фигурками и заклятием — параллель к кукле Нектанеба в <a href="zacher-1.html#c5">эпитоме Юлия Валерия, I.5</a>
    - group: love
