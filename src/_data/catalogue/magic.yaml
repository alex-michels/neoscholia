      origLang: grc
      info: поздняя античность · греческие гексаметры
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: нет'
          kind: gap
        - 'FR: Zito 2016'
      rows:
        - - Основа
          - Ludwich 1877 (ОД)
        - - Зачем
