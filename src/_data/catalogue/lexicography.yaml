catalogue:
  title: Тексты раздела
  note: 'Порядок — от первых публикаций к долгим проектам. Словари переводим блоками: книга, буква или тематический раздел.'
  id: cat-h
  filterLabel: Фильтр текстов
  all: Все
  groups:
    - key: gr
      label: Греческие
    - key: la
      label: Латинские
    - key: ru
      label: Только для русского
  flag: только не переведённые ни на один язык
  empty: По этому фильтру текстов нет.
  items:
    - group: gr
      flag: true
      plan: первый пилот
      title: Поллукс, «Ономастикон»
      orig: Ὀνομαστικόν
      origLang: grc
      info: II в. · греческий · 10 книг · посвящён императору Коммоду
      tr:
        - text: 'RU: отрывки'
          kind: gap
        - 'EN: отрывки; полный перевод объявлен (CUP, 2027)'
        - 'IT: IX.94–129'
      rows:
        - - Основа
          - Bethe 1900–1937 (ОД в России и ЕС)
        - - Первая часть
          - 'IX.94–129: игры — игральные кости (<span lang="grc">κύβοι</span>) и астрагалы (<span lang="grc">ἀστράγαλοι</span>, по-русски «бабки»: косточки из суставов овец и коз), мяч, детские игры с припевами (~3 тыс. слов)'
        - - Зачем
          - 'словарь, где слова собраны по предметам: театр и музыка, суд и рынок, кухня и ремёсла; полон цитат утраченной комедии'
    - group: gr
      flag: true
      plan: основная серия
      title: Зенобий, «Эпитома пословиц»
      orig: Ἐπιτομὴ τῶν Ταρραίου καὶ Διδύμου παροιμιῶν
      origLang: grc
      info: II в. · греческий · шесть «сотен» пословиц
      tr:
        - text: 'RU: отрывки'
          kind: gap
        - text: 'EN: нет'
          kind: gap
        - 'IT: полный (Lelli 2006)'
      rows:
        - - Основа
          - Leutsch, Schneidewin, «Corpus paroemiographorum Graecorum» I, 1839 (ОД)
        - - Первая часть
          - первая сотня (~4–5 тыс. слов)
        - - Зачем
          - 'откуда пошло выражение: каждая пословица объяснена мифом, обрядом, историей или строкой из комедии'
    - group: gr
      plan: кандидат
      title: Псевдо-Аммоний, «О сходных и различных словах»
      orig: Περὶ ὁμοίων καὶ διαφόρων λέξεων
      origLang: grc
      info: поздняя античность · греческий · словарь синонимов
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: нет'
          kind: gap
      rows:
        - - Основа
          - Valckenaer 1822 (ОД)
        - - Первая часть
          - буква Α (91 статья, ~3 тыс. слов)
        - - Зачем
          - чем различаются близкие слова — например, βίος и ζωή, «образ жизни» и «жизнь»
    - group: gr
      nowhere: true
      plan: кандидат · сверить статус
      planMuted: true
      title: Аполлоний Софист, «Гомеровский словарь»
      orig: Λέξεις Ὁμηρικαί
      origLang: grc
      info: I в. · греческий
      tr:
        - text: 'RU: не найден'
          kind: gap
        - text: 'EN: не найден'
          kind: gap
      rows:
        - - Основа
          - Bekker 1833 (ОД); готовится новое издание
        - - Первая часть
          - глоссы к словам «Одиссеи» X — в пару к нашим схолиям
        - - Зачем
          - как понимали трудные слова Гомера в римское время; сохранил глоссы Апиона
    - group: gr
      plan: кандидат
      title: Фриних, «Эклога»
      orig: Ἐκλογὴ ῥημάτων καὶ ὀνομάτων Ἀττικῶν
      origLang: grc
      info: II в. · греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: отрывки'
      rows:
        - - Основа
          - Rutherford 1881 (ОД)
        - - Первая часть
          - посвящение и статьи 1–100
        - - Зачем
          - '«так не говори, говори так»: живой язык II в. глазами пуриста'
    - group: gr
      plan: кандидат
      title: Тимей, «Словарь к Платону»
      orig: Ἐκ τῶν τοῦ Πλάτωνος λέξεων
      origLang: grc
      info: поздняя античность · греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: нет'
          kind: gap
        - 'FR: полный (Bonelli 2007)'
      rows:
        - - Основа
          - Ruhnken 1789 (ОД)
        - - Первая часть
          - предисловие и буква Α
    - group: gr
      plan: кандидат
      title: Эротиан, «Словарь к Гиппократу»
      orig: Τῶν παρ’ Ἱπποκράτει λέξεων συναγωγή
      origLang: grc
      info: I в. · греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: нет'
          kind: gap
        - 'LA: XVI–XVIII вв.'
      rows:
        - - Основа
          - Nachmanson 1918 (ОД)
        - - Зачем
          - в предисловии — древнейший перечень сочинений Гиппократа
    - group: la
      plan: кандидат
      title: Ноний Марцелл, «Сжатое учение»
      orig: De compendiosa doctrina
      origLang: la
      info: IV в. · латынь · 20 книг
      tr:
        - text: 'RU: частично (кн. XIV–XX)'
          kind: gap
        - text: 'EN: нет'
          kind: gap
      rows:
        - - Основа
          - Lindsay 1903 (ОД)
        - - Первая часть
          - кн. V или VI
        - - Зачем
          - главный хранитель цитат из утраченной латинской литературы Республики
    - group: la
      plan: кандидат
      title: Фест, «О значении слов»
      orig: De verborum significatu
      origLang: la
      info: II в. · латынь · сохранился частично
      tr:
        - text: 'RU: только эпитома Павла Диакона'
          kind: gap
        - text: 'EN: научного нет'
          kind: gap
        - 'FR: полный (1846)'
      rows:
        - - Основа
          - Lindsay 1913 (ОД)
        - - Первая часть
          - буква M — уцелевший текст самого Феста
        - - Зачем
          - римская религия, право и древности по Веррию Флакку
    - group: ru
      plan: кандидат
      title: Фульгенций, «Объяснение старинных слов»
      orig: Expositio sermonum antiquorum
      origLang: la
      info: V–VI вв. · латынь · 62 глоссы
      tr:
        - text: 'RU: не найден'
          kind: gap
        - 'EN: полный (Whitbread 1971)'
      rows:
        - - Основа
          - Helm 1898 (ОД)
        - - Зачем
          - словарь, где многие «цитаты» древних авторов, по-видимому, выдуманы самим Фульгенцием
    - group: ru
      plan: кандидат
      title: Варрон, «О латинском языке», кн. V–VII
      orig: De lingua Latina
      origLang: la
      info: I в. до н. э. · латынь
      tr:
