h1: Лексикография
intro:
  - 'Античные словари начались с трудных слов Гомера: александрийские филологи собирали «глоссы» — устаревшие и диалектные слова поэтов. Потом появились словари к ораторам, к Платону и Гиппократу, словари «правильного» аттического языка, тематический «Ономастикон» Поллукса, сборники пословиц с объяснениями, а в Византии — огромные Гесихий, «Суда» и этимологики.'
  - 'Для читателя это не только слова. В словарях сохранились цитаты из утраченных книг, прежде всего из комедии, и тысячи бытовых реалий: инструменты и игры, одежда и посуда, суды и праздники. По-русски из этого почти ничего нет, кроме отдельных глосс и латинских антикваров; мы начинаем с Поллукса и Зенобия.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты-лексикографы приглашаются'
facts:
  - label: Первый пилот
    text: 'Поллукс, «Ономастикон» IX.94–129: игры — игральные кости и астрагалы, мяч, детские игры'
  - label: Основная серия
    text: Зенобий, «Эпитома пословиц» — по сотне пословиц, с объяснениями
