# Раздел библиотеки «Любовь и брак»: всё содержимое страницы love.html.
# Как устроен файл и что значит каждое поле — в src/_data/catalogue/README.md. Шаблон страницы: src/_includes/section-body.njk.
h1: Любовь и брак
intro:
  - 'Как в древности влюблялись, женились и разводились, рожали детей — об этом писали философы и врачи, законодатели и романисты, а иногда сами супруги и родители в письмах на папирусе. Многое из этого ни разу не переводилось на русский: стоические трактаты о браке, главы Стобея о браке, «Гинекология» Сорана, византийские романы, брачные новеллы Льва VI.'
  - 'Раздел идёт по жизненному кругу: любовь и любовные истории, брак и дом, рождение. Воспитание и школа — в разделе <a href="education.html">«Образование и воспитание»</a>. Отдельная группа — «Эрос и тело»: медицина о поле и сексуальности, письма гетер, фрагменты любовных наставлений. Эти тексты мы описываем и переводим как источники, без смакования. Привороты и гадания о любви и браке — в разделе <a href="magic.html#love-magic">«Магия и мантика»</a>.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты — историки семьи, медицины и права — приглашаются'
facts:
  - label: Первая публикация
    text: 'Гиерокл-стоик, «О браке»: брак естествен, жена — полноправный партнёр'
