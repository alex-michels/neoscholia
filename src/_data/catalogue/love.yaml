catalogue:
  title: Тексты раздела
  note: Карточки идут по жизненному кругу. Медицинские тексты проверяет историк медицины, папирусы — папиролог.
  id: cat-h
  filterLabel: Фильтр текстов
  all: Все
  groups:
    - key: stories
      label: Любовные истории
    - key: marriage
      label: Брак и дом
    - key: birth
      label: Рождение
    - key: x18
      label: Эрос и тело
  flag: только не переведённые ни на один язык
  empty: По этому фильтру текстов нет.
  items:
    - group: stories
      flag: true
      plan: кандидат
      title: Феодор Продром, «Роданфа и Досикл»
      orig: Τὰ κατὰ Ῥοδάνθην καὶ Δοσικλέα
      origLang: grc
      info: XII в. · греческие ямбы · 9 книг
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Jeffreys 2012)'
      rows:
        - - Основа
          - Hercher 1859 (ОД)
        - - Первая часть
          - кн. I (~500 стихов)
        - - Зачем
          - 'византийский любовный роман по античному образцу: похищения, пираты, разлука и встреча; из романов эпохи Комнинов по-русски его нет'
    - group: stories
      plan: кандидат
      title: Конон, «Рассказы»
      orig: Διηγήσεις
      origLang: grc
      info: эпоха Августа · греческий · 50 мифов в пересказе Фотия
      tr:
        - text: 'RU: 9 рассказов'
          kind: gap
        - 'EN: полный (Brown 2002)'
      rows:
        - - Основа
          - Фотий, «Библиотека», код 186 (ОД)
        - - Зачем
          - короткие истории о любви, превращениях и основании городов
    - group: stories
      plan: кандидат
      title: «Каллимах и Хрисорроя»
      orig: Τὰ κατὰ Καλλίμαχον καὶ Χρυσορρόην
      origLang: grc
      info: XIV в. · народный греческий, стихи
      tr:
        - text: 'RU: не найден'
          kind: gap
        - 'EN: полный (Betts 1995)'
      rows:
        - - Основа
          - Lambros 1880 (ОД)
        - - Зачем
          - 'рыцарский роман Византии: замок дракона, пленная царевна, колдунья и волшебное яблоко'
    - group: marriage
      flag: true
      plan: первая публикация
      title: Гиерокл-стоик, «О браке», «О домоводстве», «О родственниках»
      orig: Περὶ γάμου · Οἰκονομικός · Πῶς συγγενέσι χρηστέον
      origLang: grc
      info: II в. · греческий · фрагменты у Стобея
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Ramelli, Konstan 2009)'
      rows:
        - - Основа
          - von Arnim 1906; Hense 1909 (ОД)
        - - Первая часть
          - «О браке» (~1,6 тыс. слов)
        - - Зачем
          - стоик доказывает, что брак естествен и прекрасен, а жена — полноправный партнёр; здесь и знаменитые «круги» близости — от себя до всего человечества
    - group: marriage
      flag: true
      plan: серия
      title: 'Иоанн Стобей, «Антология» IV.22–23, 27–28: брак, родня, дом'
      orig: Περὶ γάμου · Γαμικὰ παραγγέλματα · Οἰκονομικός
      origLang: grc
      info: начало V в. · греческий · сотни выдержек из утраченных книг
      tr:
        - text: 'RU: главы целиком нет'
          kind: gap
        - text: 'EN: главы целиком нет'
          kind: gap
      rows:
        - - Основа
          - Hense 1909 (ОД)
        - - Первая часть
          - IV.22 «О браке»
        - - Зачем
          - 'античный спор «жениться или нет»: за, против и «смотря на ком» — от трагиков и комиков до стоиков и пифагорейцев'
    - group: marriage
      plan: сначала связаться с переводчиком
      planMuted: true
      title: 'Пифагорейские женщины: Феано, Периктиона, Финтида'
      orig: письмо Феано к Никострате; «О гармонии женщины»; «О скромности женщины»
      info: III в. до н. э. – I в. н. э. · греческий
      tr:
        - text: 'RU: частично'
          kind: gap
        - 'EN: полный'
      rows:
        - - Основа
          - Hense; Hercher 1873 (ОД)
        - - Зачем
          - 'женские голоса (или выдаваемые за женские) о браке, ревности и одежде: Феано советует жене, как вести себя, когда у мужа любовница'
    - group: marriage
      plan: кандидат
      title: Лев VI Мудрый, новеллы о браке
      orig: Novellae Leonis
      origLang: la
      info: 886–912 · греческий · около 12 новелл
      tr:
        - text: 'RU: не найден'
          kind: gap
        - text: 'EN: только с латинского перевода XVI в. (1932)'
          kind: gap
      rows:
        - - Основа
          - Zachariae von Lingenthal, «Jus Graecoromanum» III, 1857 (ОД)
        - - Зачем
          - 'как Церковь забрала брак в свои руки: обручение, венчание, развод, наложницы, третий брак'
    - group: marriage
      plan: нужен папиролог
      planMuted: true
      title: Брачные договоры, разводы и приданое в папирусах
      orig: от P.Eleph. 1 (311 г. до н. э.) до VII в.
      info: документы · греческий
      tr:
        - text: 'RU: подборки нет'
          kind: gap
        - 'EN: хорошо (Select Papyri)'
      rows:
        - - Основа
          - papyri.info (CC BY)
        - - Зачем
          - 'настоящие условия брака: приданое, обязанности сторон, «не приводить в дом другую жену»'
    - group: birth
      flag: true
      plan: кандидат
      title: Соран Эфесский, «Гинекология»
      orig: Γυναικεῖα
      origLang: grc
      info: начало II в. · греческий · 4 книги
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Temkin 1956)'
        - 'FR: полный'
      rows:
        - - Основа
          - Ilberg, CMG IV, 1927 (ОД)
        - - Первая часть
          - 'I.1–4: какой должна быть повитуха; затем кн. II — новорождённый, кормилица, пеленание'
        - - Зачем
          - самое полное античное сочинение о женском теле, родах и уходе за младенцем
    - group: birth
      plan: кандидат
      title: Мусцио, «Гинекология»
      orig: Gynaecia
      origLang: la
      info: около 500 г. · латынь · вопросы и ответы
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: только неопубликованная диссертация'
          kind: gap
        - 'DE: 1997'
      rows:
        - - Основа
          - Rose 1882 (ОД)
        - - Зачем
          - «катехизис» для повитух — переложение Сорана для латинского Запада
    - group: x18
      flag: true
      plan: кандидат
      title: Руф Эфесский, «О сатириазе и гонорее»
      orig: Περὶ σατυριάσεως καὶ γονορροίας
      origLang: grc
      info: около 100 г. · греческий · медицина
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: не найден'
          kind: gap
        - 'FR: 1879'
      rows:
        - - Основа
          - Daremberg, Ruelle 1879 (ОД)
        - - Зачем
          - 'античная андрология: болезни мужской половой сферы глазами одного из лучших врачей империи'
    - group: x18
      plan: кандидат
      title: 'Орибасий, «Врачебное собрание» VI.37–38: о любовных утехах'
      orig: Περὶ ἀφροδισίων
      origLang: grc
      info: IV в. · греческий · выдержки из Галена и Руфа
      tr:
        - text: 'RU: нет'
          kind: gap
        - text: 'EN: не найден'
          kind: gap
        - 'FR: 1851'
      rows:
        - - Основа
          - Bussemaker, Daremberg 1851 (ОД)
        - - Зачем
          - что античная медицина советовала о частоте, времени и последствиях близости; по мнению исследователей, у истоков средневекового жанра «О соитии»
    - group: x18
      plan: только для русского
      title: Целий Аврелиан, «Хронические болезни» IV.9
      orig: 'De morbis chronicis IV.9: De mollibus'
      origLang: la
      info: V в. · латынь · по Сорану
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Drabkin 1950)'
      rows:
        - - Основа
          - издание 1709 г. (ОД)
        - - Зачем
          - как античная медицина рассматривала однополое влечение — как болезнь души, а не тела
    - group: x18
      plan: досье · нужен папиролог
      planMuted: true
      title: 'Филенида: фрагменты античного «пособия»'
      orig: P.Oxy. 2891; свидетельства об Элефантиде и Астианассе
      info: IV–III вв. до н. э. (папирус II в. н. э.) · греческий
      tr:
        - text: 'RU: не найден'
          kind: gap
        - 'EN: есть (Parker 1992)'
      rows:
        - - Основа
          - античный текст по папирусу; издание Lobel 1972 — под правами
        - - Зачем
          - что осталось от утраченного жанра любовных наставлений, о котором античные авторы говорят с насмешкой
exists:
  title: Уже есть на русском
  note: Эти тексты мы не переводим заново и ссылаемся на них в комментарии.
  items:
    - - 'Мусоний Руф: о женщинах, о любовных утехах, о браке и детях'
      - А. А. Столяров, 2016
    - - Антипатр Тарсийский, «О браке»
      - А. А. Столяров, 2010
    - - Псевдо-Аристотель, «Экономика» I–III
      - Г. А. Таронян, ВДИ 1969
    - - 'Плутарх: «Наставления супругам», «Об Эроте», «Утешение к жене», «Любовные истории»'
      - разные переводчики
    - - Письма пифагореек Мелиссы и Мии, часть письма Феано
      - Афонасина, ΣΧΟΛΗ 2017–2018
    - - Парфений, «Любовные страсти»
      - В. Н. Ярхо, ВДИ 1992
    - - Аристенет; Евмафий Макремволит, «Повесть об Исмине и Исминии»
      - С. В. Полякова, 1965
    - - 'Гиппократ: «О семени», «О природе ребёнка», «Женские болезни»'
      - В. И. Руднев, 1936
    - - Артемидор, «Сонник», в том числе сны о любви (I.78–80)
      - ВДИ, 1989–1991
