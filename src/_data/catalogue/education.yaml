          - Wachsmuth 1884 (ОД)
        - - Первая часть
          - апофтегмы и философские выдержки (около 41–100); уже переведённое — Мусоний, поэты, Демокрит — даём ссылками
        - - Зачем
          - 'самая полная античная хрестоматия о воспитании: зачем учиться, природа и упражнение, учителя и наказания'
    - group: upbringing
      flag: true
