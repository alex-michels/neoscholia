h1: Образование и воспитание
intro:
  - 'Греки называли это одним словом — <span lang="grc">παιδεία</span>: и воспитание ребёнка, и школа, и образованность взрослого. О ней спорили философы и врачи, писали учебники грамматики и риторики, наставляли сыновей императоры, а родители и ученики писали друг другу письма на папирусе.'
  - 'По-русски из этого мира переведены классики — Платон, Исократ, Квинтилиан, Плутарх, Августин — и многое из Либания, Гимерия, Хорикия. Не переведены хрестоматии и учебники, по которым учились: главы Стобея о воспитании и о детях, школьные упражнения, византийские поучения сыновьям, латинские грамматики. С них мы и начинаем.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты — историки образования и педагогики — приглашаются'
facts:
  - label: Первый кандидат
