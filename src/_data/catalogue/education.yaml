      title: Эпитома Юлия Валерия, I.13
      text: 'Филипп сначала решает не растить ребёнка, «рождённого не от моего семени», потом даёт ему имя Александр. Его учителя: Леонид, Полиник (музыка), Алкипп, Менекл (геометрия), Анаксимен (риторика), Аристотель (философия).'
    - href: zacher-1.html#c14
      title: Эпитома Юлия Валерия, I.14
      text: 'Урок о звёздах: двенадцатилетний Александр спрашивает Нектанеба о небе — и сталкивает учителя в ров.'
