# Раздел библиотеки «Музыка»: всё содержимое страницы music.html.
# Как устроен файл и что значит каждое поле — в src/_data/catalogue/README.md. Шаблон страницы: src/_includes/section-body.njk.
h1: Музыка
intro:
  - 'Греки писали о музыке как о науке: о ступенях и интервалах, ладах и ритмах, о том, как звук действует на душу. Эти трактаты читали в Византии и на латинском Западе, по ним учили гармонику до Нового времени.'
  - 'Ядро греческой теории уже есть по-русски: Аристоксен, Птолемей с комментарием Порфирия, Аристид Квинтилиан, малые авторы. Этим мы обязаны В. Г. Цыпину и новосибирскому журналу ΣΧΟΛΗ. Раздел начинает там, где переводов ещё нет: византийские учебники, философский спор о музыке, нотированные памятники и музыка в жизни города.'
editor: 'Раздел ведёт: Александр Михельс, PhD · рецензенты-музыковеды приглашаются'
facts:
  - label: Нет перевода ни на одном языке
    text: Георгий Пахимер, «Гармоника» (ок. 1300)
  - label: Опубликовано
    text: <a href="synopsis-musicae.html">Анонимный «Синопсис Музыки» (1008)</a> — короткий трактат; греческий текст установлен заново по рукописям и старопечатным изданиям, перевод на русский и английский — версия {version:synopsis-musicae}; <a href="synopsis-musicae-latin.html">латинские переводы Ксиландра и Вине</a> на русском и английском — версия {version:synopsis-musicae-latin}
