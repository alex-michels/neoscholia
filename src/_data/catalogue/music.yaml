catalogue:
  title: Тексты раздела
  note: Порядок — от первых публикаций к долгим проектам. Нотацию и строй проверяет музыковед, папирусы — папиролог.
  id: cat-h
  filterLabel: Фильтр текстов
  all: Все
  groups:
    - key: byz
      label: Византийская передача
    - key: phil
      label: Философия и теория
    - key: doc
      label: Памятники и документы
    - key: ru
      label: Только для русского
  flag: только не переведённые ни на один язык
  empty: По этому фильтру текстов нет.
  items:
    - group: byz
      flag: true
      plan: опубликовано · версия {version:synopsis-musicae}
      href: synopsis-musicae.html
      title: Анонимный «Синопсис Музыки»
      orig: <span lang="grc">Τῆς μουσικῆς σύνοψις ἠκριβωμένη</span> — из анонимного «Четверокнижия» 1008 г.; прежде приписывался Пселлу
      info: 1008 г. · греческий · короткий учебник гармоники, 11 страниц издания 1556 г.
      tr:
        - 'RU, EN: Neoscholia, версия {version:synopsis-musicae}'
        - 'LA (Ксиландр 1556, Вине 1591) → RU, EN: Neoscholia, версия {version:synopsis-musicae-latin}'
        - 'DE: полный (Mizler 1746)'
      rows:
        - - Основа
          - 'свой критический текст: рукописи Pal. gr. 281 (1040) и Pal. gr. 262, издания 1545 и 1556 гг., места Paris. gr. 2448 по Венсану (1847)'
        - - Как
          - каждый источник текста прочитан дважды; текст установлен дважды независимо (Claude и GPT-6); спорные места решали судьи двух семейств моделей по словарям и теоретикам, ссылки сверены; решает редактор
        - - Перевод
          - шесть независимых переводов моделей трёх компаний, три слепых сравнения, решения редактора по спорным местам; ссылки в примечаниях сверены с источниками
        - - Дальше
          - сверка с переводами Мицлера (1746), Ксиландра и Вине; глава о трактате у Е. В. Герцмана (2022)
        - - Зачем
          - самый ранний византийский учебник гармоники; источник Зонары, Михаила Италика, Вриенния
    - group: byz
      flag: true
      nowhere: true
      plan: флагман
      title: 'Георгий Пахимер, «Четверокнижие», кн. II: «Гармоника»'
      orig: 'Σύνταγμα τῶν τεσσάρων μαθημάτων, Β′: Ἁρμονική'
      origLang: grc
      info: ок. 1300 · греческий · ~100 страниц с диаграммами
      tr:
        - text: нет ни на одном языке
          kind: none
        - 'FR: только краткое изложение (1847)'
      rows:
        - - Основа
          - Tannery &amp; Stéphanou 1940 — статус прав уточняется
        - - Первая часть
          - 'начальные главы: определения и отношения консонансов; проверка по Птолемею и Никомаху'
    - group: phil
      flag: true
      plan: флагман · нужен папиролог
      planMuted: true
      title: Филодем, «О музыке», кн. IV
      orig: Περὶ μουσικῆς Δ′ (PHerc. 1497)
      origLang: grc
      info: I в. до н. э. · геркуланский папирус · много лакун
      tr:
        - text: 'RU: отрывки'
          kind: gap
        - text: 'EN: отрывки'
          kind: gap
        - 'FR, DE: полные'
      rows:
        - - Основа
          - Kemke 1884 (ОД); нумерация и чтения — по Delattre 2007
        - - Зачем
          - 'единственный сохранившийся большой эллинистический спор о музыке: эпикуреец против стоика Диогена Вавилонского об этосе'
    - group: doc
      nowhere: true
      plan: готовится · нужен музыковед
      planMuted: true
      title: '«Документы древнегреческой музыки»: корпус с переводом'
      orig: около 60 нотированных памятников
      info: III в. до н. э. – IV в. н. э. · греческий с нотацией
      tr:
        - text: как корпус — нет ни на одном языке
          kind: none
        - 'RU: отдельные пьесы'
      rows:
        - - Основа
          - Jan 1899 (ОД); папирусы — papyri.info (CC BY)
        - - Первая часть
          - Дельфийский пеан Афинея (пеан Лимения уже переведён)
    - group: doc
      plan: готовится
      title: 'Поллукс, «Ономастикон» IV.57–90: инструменты и номы'
      orig: Ὀνομαστικόν Δ′
      origLang: grc
      info: II в. · греческий · ~8–10 страниц Teubner
      tr:
        - text: 'RU: отрывки; возможно, перевод у Е. В. Герцмана (1988, 2020) — проверяется'
          kind: gap
        - 'EN: полный объявлен (CUP, 2027)'
      rows:
        - - Основа
          - Bethe 1900 (ОД)
        - - Зачем
          - 'словарь античных инструментов: авлосы, кифара, Пифийский ном; весь «Ономастикон» — в разделе <a href="lexicography.html">«Лексикография»</a>'
    - group: doc
      plan: готовится
      title: Дельфийские декреты музыкантам и списки Сотерий
      orig: SIG³ 450, 689, 737, 738 и др.
      info: III–I вв. до н. э. · надписи
      tr:
        - text: 'RU: отрывки'
          kind: gap
        - 'EN: около 20 текстов'
      rows:
        - - Основа
          - Dittenberger, SIG³ (ОД)
        - - Зачем
          - заказ гимнов, карьеры музыкантов, арфистка Полигнота, концерт на гидравлосе в 94 г. до н. э.
    - group: doc
      plan: кандидат
      title: Папирусы о найме музыкантов и танцовщиц
      orig: контракты, расписки, праздничные счета
      info: III в. до н. э. – IV в. н. э. · документальный греческий
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: около половины'
        - 'IT: корпус (2002)'
      rows:
        - - Основа
          - papyri.info (CC BY)
    - group: ru
      plan: кандидат
      title: Халкидий, «Комментарий к „Тимею“», гл. 32–55
      orig: Commentarius in Platonis Timaeum
      origLang: la
      info: IV–V вв. · латынь · ~25–30 страниц
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный (Magee 2016)'
      rows:
        - - Основа
          - Wrobel 1876 (ОД)
        - - Зачем
          - главный латинский путь гармонии мировой души на средневековый Запад
    - group: ru
      plan: кандидат
      title: '«Проблемы» XI: о голосе'
      orig: Προβλήματα ΙΑ′ (Ὅσα περὶ φωνήν)
      origLang: grc
      info: перипатетики · 62 вопроса
      tr:
        - text: 'RU: нет'
          kind: gap
        - 'EN: полный'
      rows:
        - - Основа
          - Bekker 1831 (ОД)
        - - Зачем
          - вместе с переведёнными XIX и XV даёт русское досье греческой теории звука
    - group: ru
      plan: нужен специалист по византийскому пению
      planMuted: true
      title: «Агиополит»
      orig: Ἁγιοπολίτης
      origLang: grc
      info: ядро IX в. · греческий · трактат о церковном пении
      tr:
        - text: 'RU: отрывки (Герцман 1988)'
          kind: gap
        - 'EN: предварительный (Raasted 1983)'
      rows:
        - - Зачем
          - самое раннее описание осмогласия и связи ладов с античными видами октавы; важно для знаменного распева
