# date — как на сайте; at — время для порядка внутри дня (ГГГГ-ММ-ДДTЧЧ:ММ); text — HTML.
- date: "26.10.2026"
  at: "2026-10-26T00:57"
  text: 'Новый раздел библиотеки: <a href="love.html">«Любовь, брак, дети»</a> — любовные истории, брак и дом, рождение, воспитание детей и отдельная группа «Эрос и тело». Привороты и любовная магия — в разделе <a href="magic.html#love-magic">«Магия и мантика»</a>.'
- date: "26.10.2026"
  at: "2026-10-26T00:15"
  text: 'Новый раздел библиотеки: <a href="lexicography.html">«Лексикография»</a> — «Ономастикон» Поллукса, пословицы Зенобия, глоссы к Гомеру, аттикисты и латинские словари.'
- date: "25.10.2026"
  at: "2026-10-25T23:05"
  text: 'Новые разделы библиотеки: <a href="astronomy.html">«Астрономия и астрология»</a> и <a href="magic.html">«Магия и мантика»</a> — карта корпуса, кандидаты на перевод и то, что уже есть по-русски.'
- date: "25.10.2026"
  at: "2026-10-25T21:40"
  text: 'Открыты <a href="indexes.html">указатели</a>: авторы, произведения с цитируемыми местами, места, имена и мифы по всем текстам библиотеки, со ссылками на Wikidata и Pleiades.'
- date: "25.10.2026"
  at: "2026-10-25T21:30"
  text: 'Уточнён <a href="method.html#pipeline">метод</a>: каждый текст переводится не меньше двух раз, независимо, моделями разных семейств; публикуется один перевод, существенные расхождения — в примечаниях.'
- date: "25.10.2026"
  at: "2026-10-25T20:50"
  text: 'Книгу I <a href="zacher-1.html">эпитомы Цахера</a> можно слушать по главам, по-русски и по-английски (синтез речи Silero).'
- date: "25.10.2026"
